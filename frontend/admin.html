<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker – Admin panel</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="admin.html">💰 Admin panel</a>
      <nav class="nav">
        <a href="dashboard.html">My expenses</a>
        <button type="button" class="ghost small" id="logout">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="grid-3">
      <div class="card stat">
        <div class="label">Users</div>
        <div class="value" id="stat-users">–</div>
      </div>
      <div class="card stat">
        <div class="label">Expenses recorded</div>
        <div class="value" id="stat-expenses">–</div>
      </div>
      <div class="card stat">
        <div class="label">Total amount recorded</div>
        <div class="value" id="stat-amount">–</div>
      </div>
    </section>

    <section class="card">
      <h2>Users</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Joined</th>
              <th class="num">Expenses</th>
              <th class="num">Total spent</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="user-rows"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Recently added expenses <span class="muted" style="font-weight:400">(all users)</span></h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>User</th>
              <th>Category</th>
              <th>Description</th>
              <th class="num">Amount</th>
            </tr>
          </thead>
          <tbody id="expense-rows"></tbody>
        </table>
      </div>
      <p id="expenses-empty" class="muted" hidden>No expenses recorded yet.</p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
