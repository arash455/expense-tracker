<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker – My expenses</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="dashboard.html">💰 Expense Tracker</a>
      <nav class="nav">
        <span class="muted">Hi, <strong id="user-name"></strong></span>
        <a id="admin-link" href="admin.html" hidden>Admin panel</a>
        <button type="button" class="ghost small" id="logout">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Summary -->
    <section class="grid-3">
      <div class="card stat">
        <div class="label">This month</div>
        <div class="value" id="stat-month">–</div>
      </div>
      <div class="card stat">
        <div class="label">All time</div>
        <div class="value" id="stat-total">–</div>
      </div>
      <div class="card stat">
        <div class="label">Expenses recorded</div>
        <div class="value" id="stat-count">–</div>
      </div>
    </section>

    <section class="grid-2">
      <!-- Add expense -->
      <div class="card">
        <h2>Add an expense</h2>
        <form id="expense-form">
          <div class="row">
            <div class="field">
              <label for="amount">Amount</label>
              <input id="amount" name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00">
            </div>
            <div class="field">
              <label for="spent_on">Date</label>
              <input id="spent_on" name="spent_on" type="date" required>
            </div>
          </div>
          <div class="field">
            <label for="category">Category</label>
            <select id="category" name="category" required></select>
          </div>
          <div class="field">
            <label for="description">Description <span class="muted">(optional)</span></label>
            <input id="description" name="description" maxlength="200" placeholder="e.g. Lunch with friends">
          </div>
          <button type="submit" class="full">Save expense</button>
          <p id="form-message" class="message"></p>
        </form>
      </div>

      <!-- Report: by category -->
      <div class="card">
        <h2>Spending by category</h2>
        <div id="by-category"></div>
      </div>
    </section>

    <!-- Expense list -->
    <section class="card" style="margin-top:20px">
      <div class="section-head">
        <h2>My expenses</h2>
        <div class="inline-filter">
          <label for="month-filter" style="margin:0">Month</label>
          <input id="month-filter" type="month">
          <button type="button" class="ghost small" id="clear-filter">Show all</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Description</th>
              <th class="num">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expense-rows"></tbody>
          <tfoot>
            <tr>
              <td colspan="3">Total</td>
              <td class="num" id="list-total"></td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
      <p id="list-empty" class="muted" hidden>No expenses yet. Add your first one above!</p>
    </section>

    <!-- Report: by month -->
    <section class="card">
      <h2>Monthly report <span class="muted" style="font-weight:400">(last 12 months)</span></h2>
      <div id="by-month"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
